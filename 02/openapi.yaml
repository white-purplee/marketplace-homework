openapi: 3.0.3
info:
  title: Marketplace
  version: 1.0.0
  description: Контракт сервиса. Денежные значения — decimal с двумя знаками после
    точки; даты — ISO 8601 с часовым поясом.
security:
- bearerAuth: []
paths:
  /products:
    post:
      operationId: create_product
      description: 'SELLER создаёт свой товар; ADMIN может указать seller_id в query.
        Роли: SELLER, ADMIN.'
      responses:
        '201':
          description: Успех
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '401':
          description: TOKEN_INVALID, TOKEN_EXPIRED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: ACCESS_DENIED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          description: VALIDATION_ERROR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: INTERNAL_ERROR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-roles: &id003
      - SELLER
      - ADMIN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductCreate'
      parameters:
      - name: seller_id
        in: query
        schema: &id002
          type: integer
          format: int64
          minimum: 1
    get:
      operationId: list_products
      description: 'Точное совпадение категории и статуса. Страницы с нуля. Роли:
        USER, SELLER, ADMIN.'
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPage'
        '401':
          description: TOKEN_INVALID, TOKEN_EXPIRED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: ACCESS_DENIED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          description: VALIDATION_ERROR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: INTERNAL_ERROR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-roles: &id001
      - USER
      - SELLER
      - ADMIN
      parameters:
      - name: page
        in: query
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: size
        in: query
        schema:
          type: integer
          minimum: 1
          default: 20
      - name: status
        in: query
        schema: &id005
          type: string
          enum:
          - ACTIVE
          - INACTIVE
          - ARCHIVED
      - name: category
        in: query
        schema:
          type: string
  /products/{id}:
    get:
      operationId: get_product
      description: 'Чтение любого товара. Роли: USER, SELLER, ADMIN.'
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '401':
          description: TOKEN_INVALID, TOKEN_EXPIRED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: ACCESS_DENIED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          description: VALIDATION_ERROR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: INTERNAL_ERROR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: PRODUCT_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-roles: *id001
      parameters:
      - name: id
        in: path
        required: true
        schema: *id002
    put:
      operationId: update_product
      description: 'SELLER меняет только свои товары; ADMIN — любые. DELETE переводит
        в ARCHIVED. Роли: SELLER, ADMIN.'
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '401':
          description: TOKEN_INVALID, TOKEN_EXPIRED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: ACCESS_DENIED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          description: VALIDATION_ERROR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: INTERNAL_ERROR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: PRODUCT_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-roles: *id003
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductUpdate'
      parameters:
      - name: id
        in: path
        required: true
        schema: *id002
    delete:
      operationId: delete_product
      description: 'SELLER меняет только свои товары; ADMIN — любые. DELETE переводит
        в ARCHIVED. Роли: SELLER, ADMIN.'
      responses:
        '204':
          description: Успех
        '401':
          description: TOKEN_INVALID, TOKEN_EXPIRED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: ACCESS_DENIED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          description: VALIDATION_ERROR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: INTERNAL_ERROR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: PRODUCT_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-roles: *id003
      parameters:
      - name: id
        in: path
        required: true
        schema: *id002
  /orders:
    post:
      operationId: create_order
      description: 'Создание с резервированием остатков. Частота CREATE_ORDER ограничена
        ORDER_INTERVAL_MINUTES. Один активный заказ. Каждая позиция содержит от 1 до 999 единиц. Остаток проверяется
        по сумме всех позиций одного товара. Роли: USER, ADMIN.'
      responses:
        '201':
          description: Успех
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '401':
          description: TOKEN_INVALID, TOKEN_EXPIRED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: ACCESS_DENIED, ORDER_OWNERSHIP_VIOLATION
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          description: VALIDATION_ERROR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: INTERNAL_ERROR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: ORDER_NOT_FOUND, PRODUCT_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: PRODUCT_INACTIVE, ORDER_HAS_ACTIVE, INVALID_STATE_TRANSITION,
            INSUFFICIENT_STOCK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: PROMO_CODE_INVALID, PROMO_CODE_MIN_AMOUNT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: ORDER_LIMIT_EXCEEDED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-roles: &id004
      - USER
      - ADMIN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderCreate'
      parameters: []
  /orders/{id}:
    get:
      operationId: get_order
      description: 'USER читает свой заказ, ADMIN — любой. Роли: USER, ADMIN.'
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '401':
          description: TOKEN_INVALID, TOKEN_EXPIRED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: ACCESS_DENIED, ORDER_OWNERSHIP_VIOLATION
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          description: VALIDATION_ERROR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: INTERNAL_ERROR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: ORDER_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-roles: *id004
      parameters:
      - name: id
        in: path
        required: true
        schema: *id002
    put:
      operationId: update_order
      description: 'Замена позиций только в CREATED. UPDATE_ORDER ограничен отдельно.
        Цены новых позиций берутся из каталога. Промокод проверяется заново, при сумме
        ниже минимума снимается. Роли: USER, ADMIN.'
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '401':
          description: TOKEN_INVALID, TOKEN_EXPIRED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: ACCESS_DENIED, ORDER_OWNERSHIP_VIOLATION
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          description: VALIDATION_ERROR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: INTERNAL_ERROR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: ORDER_NOT_FOUND, PRODUCT_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: PRODUCT_INACTIVE, ORDER_HAS_ACTIVE, INVALID_STATE_TRANSITION,
            INSUFFICIENT_STOCK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: PROMO_CODE_INVALID, PROMO_CODE_MIN_AMOUNT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: ORDER_LIMIT_EXCEEDED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-roles: *id004
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderUpdate'
      parameters:
      - name: id
        in: path
        required: true
        schema: *id002
  /orders/{id}/cancel:
    post:
      operationId: cancel_order
      description: 'Отмена из CREATED или PAYMENT_PENDING, возврат остатков и использования
        промокода. Роли: USER, ADMIN.'
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '401':
          description: TOKEN_INVALID, TOKEN_EXPIRED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: ACCESS_DENIED, ORDER_OWNERSHIP_VIOLATION
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          description: VALIDATION_ERROR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: INTERNAL_ERROR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: ORDER_NOT_FOUND, PRODUCT_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: PRODUCT_INACTIVE, ORDER_HAS_ACTIVE, INVALID_STATE_TRANSITION,
            INSUFFICIENT_STOCK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: PROMO_CODE_INVALID, PROMO_CODE_MIN_AMOUNT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: ORDER_LIMIT_EXCEEDED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-roles: *id004
      parameters:
      - name: id
        in: path
        required: true
        schema: *id002
  /orders/{id}/status:
    patch:
      operationId: change_order_status
      description: 'Переходы CREATED → PAYMENT_PENDING → PAID → SHIPPED → COMPLETED.
        USER — свой заказ, ADMIN — любой. Отмена через /cancel. Этот путь выбран для
        реализации обязательной модели состояний: в задании URL не задан. Роли: USER,
        ADMIN.'
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '401':
          description: TOKEN_INVALID, TOKEN_EXPIRED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: ACCESS_DENIED, ORDER_OWNERSHIP_VIOLATION
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          description: VALIDATION_ERROR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: INTERNAL_ERROR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: ORDER_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: INVALID_STATE_TRANSITION
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-roles: *id004
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderStatusUpdate'
      parameters:
      - name: id
        in: path
        required: true
        schema: *id002
  /promo-codes:
    post:
      operationId: create_promo
      description: 'Процентная скидка свыше 70% не применяется (цена 100%), как указано
        в задании. FIXED_AMOUNT ограничена суммой заказа. Роли: SELLER, ADMIN.'
      responses:
        '201':
          description: Успех
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromoResponse'
        '401':
          description: TOKEN_INVALID, TOKEN_EXPIRED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: ACCESS_DENIED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          description: VALIDATION_ERROR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: INTERNAL_ERROR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: PROMO_CODE_EXISTS
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-roles: *id003
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PromoCreate'
      parameters: []
  /auth/register:
    post:
      operationId: register
      description: Регистрация USER или SELLER. ADMIN создаётся при запуске из переменных
        окружения.
      responses:
        '201':
          description: Успех
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: VALIDATION_ERROR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: INTERNAL_ERROR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: USER_EXISTS
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      parameters: []
  /auth/login:
    post:
      operationId: login
      description: ''
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          description: VALIDATION_ERROR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: INTERNAL_ERROR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: INVALID_CREDENTIALS
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      parameters: []
  /auth/refresh:
    post:
      operationId: refresh
      description: ''
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          description: VALIDATION_ERROR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: INTERNAL_ERROR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: REFRESH_TOKEN_INVALID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      parameters: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ProductCreate:
      type: object
      additionalProperties: false
      properties: &id006
        name: &id008
          type: string
          minLength: 1
          maxLength: 255
        description: &id009
          type: string
          maxLength: 4000
          nullable: true
        price: &id010
          type: number
          format: decimal
          minimum: 0.01
        stock: &id011
          type: integer
          minimum: 0
        category: &id012
          type: string
          minLength: 1
          maxLength: 100
        status: *id005
      required: &id007
      - name
      - price
      - stock
      - category
      - status
    ProductUpdate:
      type: object
      additionalProperties: false
      properties: *id006
      required: *id007
    ProductResponse:
      type: object
      additionalProperties: false
      properties:
        id: *id002
        name: *id008
        description: *id009
        price: *id010
        stock: *id011
        category: *id012
        status: *id005
        seller_id: *id002
        created_at: &id013
          type: string
          format: date-time
        updated_at: *id013
      required:
      - id
      - name
      - description
      - price
      - stock
      - category
      - status
      - seller_id
      - created_at
      - updated_at
    ProductPage:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ProductResponse'
        totalElements:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
      required:
      - items
      - totalElements
      - page
      - size
    Error:
      type: object
      additionalProperties: false
      properties:
        error_code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true
          nullable: true
      required:
      - error_code
      - message
    OrderItem:
      type: object
      additionalProperties: false
      properties:
        product_id: *id002
        quantity:
          type: integer
          minimum: 1
          maximum: 999
      required:
      - product_id
      - quantity
    OrderItemResponse:
      type: object
      additionalProperties: false
      properties:
        id: *id002
        product_id: *id002
        quantity:
          type: integer
          minimum: 1
          maximum: 999
        price_at_order:
          type: number
          format: decimal
      required:
      - id
      - product_id
      - quantity
      - price_at_order
    OrderStatus:
      type: string
      enum:
      - CREATED
      - PAYMENT_PENDING
      - PAID
      - SHIPPED
      - COMPLETED
      - CANCELED
    OrderStatusUpdate:
      type: object
      additionalProperties: false
      properties:
        status:
          $ref: '#/components/schemas/OrderStatus'
      required:
      - status
    RegisterRequest:
      type: object
      additionalProperties: false
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 100
        password:
          type: string
          minLength: 1
          maxLength: 255
        role:
          type: string
          enum:
          - USER
          - SELLER
          default: USER
      required:
      - username
      - password
    LoginRequest:
      type: object
      additionalProperties: false
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 100
        password:
          type: string
          minLength: 1
          maxLength: 255
      required:
      - username
      - password
    UserResponse:
      type: object
      additionalProperties: false
      properties:
        id: *id002
        username:
          type: string
        role:
          type: string
          enum:
          - USER
          - SELLER
          - ADMIN
      required:
      - id
      - username
      - role
    RefreshRequest:
      type: object
      additionalProperties: false
      properties:
        refresh_token:
          type: string
          minLength: 1
      required:
      - refresh_token
    TokenResponse:
      type: object
      additionalProperties: false
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
          enum:
          - bearer
      required:
      - access_token
      - refresh_token
      - token_type
    OrderCreate:
      type: object
      additionalProperties: false
      properties:
        items: &id014
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: '#/components/schemas/OrderItem'
        promo_code:
          type: string
          pattern: ^[A-Z0-9_]{4,20}$
