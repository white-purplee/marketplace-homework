services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: marketplace
      POSTGRES_USER: marketplace
      POSTGRES_PASSWORD: marketplace
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketplace -d marketplace"]
      interval: 2s
      timeout: 3s
      retries: 30
  migrate:
    image: flyway/flyway:11.17.2
    command: -url=jdbc:postgresql://db:5432/marketplace -user=marketplace -password=marketplace migrate
    volumes:
      - ./migrations:/flyway/sql:ro
    depends_on:
      db:
        condition: service_healthy
  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: postgresql://marketplace:marketplace@db:5432/marketplace
      JWT_SECRET: ${JWT_SECRET:-local-homework-secret-change-if-publishing}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      ORDER_INTERVAL_MINUTES: ${ORDER_INTERVAL_MINUTES:-1}
    depends_on:
      migrate:
        condition: service_completed_successfully
volumes:
  postgres_data:
